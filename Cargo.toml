[package]
name = "handterm"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "Wayland-native terminal focused on low latency"
license = "MIT"
repository = "https://github.com/1jehuang/handterm"

[workspace]
members = [
    ".",
    "handterm-common",
    "handterm-server",
    "handterm-client",
]
resolver = "2"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.28", features = ["derive"] }
dirs = "6.0.0"
freetype-rs = "0.38"
fontconfig = "0.7"
handterm-common = { path = "handterm-common" }
nix = { version = "0.30.1", features = ["term", "process", "signal", "fs", "poll"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
softbuffer = { version = "0.4.6", optional = true }
toml = "0.8.20"
unicode-width = "0.2"
unicode-segmentation = "1.12.0"
rustybuzz = { version = "0.20", optional = true }
wgpu = { version = "28.0.0", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
winit = { version = "0.30.9", default-features = false, features = ["wayland", "rwh_06", "wayland-dlopen"] }
bincode = "1.3.3"

[features]
default = ["cpu", "gpu", "ligatures"]
cpu = ["dep:softbuffer"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]
ligatures = ["dep:rustybuzz"]

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
tempfile = "3.15.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
