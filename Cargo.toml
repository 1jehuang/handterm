[package]
name = "handterm"
version = "0.1.0"
edition = "2024"
description = "Wayland-native terminal focused on low latency"
license = "MIT"
repository = "https://github.com/1jehuang/handterm"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.28", features = ["derive"] }
dirs = "6.0.0"
freetype-rs = "0.38"
fontconfig = "0.7"
nix = { version = "0.30.1", features = ["term", "process", "signal", "fs"] }
serde = { version = "1.0.217", features = ["derive"] }
softbuffer = "0.4.6"
toml = "0.8.20"
winit = { version = "0.30.9", default-features = false, features = ["wayland", "rwh_06", "wayland-dlopen"] }

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
tempfile = "3.15.0"
